<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dungeons &amp; Dragons</title>
  <meta name="description" content="Mark Priem on Dungeons &amp; Dragons: starting out at the table with his son, playing several campaigns, running his own Candlekeep campaign, printing and painting terrain and miniatures, and building his own virtual tabletop, Dungeon Desk.">
  <meta property="og:title" content="Dungeons &amp; Dragons · Mark Priem">
  <meta property="og:description" content="A story about D&amp;D: storytelling, worldbuilding, arts and crafts, and a home-made virtual tabletop.">
  <meta property="og:image" content="https://mpriem.github.io/dnd/media/dungeon-desk-logo.png">
  <meta name="theme-color" content="#05070d">
  <link rel="icon" href="media/d20.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The Dungeon Desk idle stage: candlelight, arcane glow, a slowly turning rune circle and rising embers. -->
  <div class="backdrop" aria-hidden="true">
    <div class="glow candle"></div>
    <div class="glow arcane"></div>
    <div class="graticule"></div>
    <svg class="runes" viewBox="0 0 400 400">
      <circle cx="200" cy="200" r="196"/>
      <circle cx="200" cy="200" r="172" stroke-dasharray="2 10"/>
      <circle cx="200" cy="200" r="120"/>
      <polygon points="200,30 347,285 53,285"/>
      <polygon points="200,370 53,115 347,115"/>
    </svg>
    <div class="embers" id="embers"></div>
    <div class="vignette"></div>
  </div>

  <header class="top">
    <span class="place"><img src="media/d20.svg" alt="" width="24" height="24">Dungeons &amp; Dragons</span>
    <nav class="chapters" id="chapters" aria-label="Chapters">
      <button type="button" aria-label="Chapter one: It started with my son"><b>I</b><span>The first roll</span></button>
      <button type="button" aria-label="Chapter two: Now I run my own table"><b>II</b><span>Behind the screen</span></button>
      <button type="button" aria-label="Chapter three: Printed, painted, put on the table"><b>III</b><span>Arts &amp; crafts</span></button>
      <button type="button" aria-label="Chapter four: Dungeon Desk"><b>IV</b><span>Dungeon Desk</span></button>
    </nav>
    <a class="home" id="back" href="../marks-room/?island=dnd">&larr; island</a>
  </header>

  <main class="stage" id="stage" aria-roledescription="carousel" aria-label="Pictures and panels about Dungeons &amp; Dragons">
    <p class="hint">Tap the cards to draw the next one</p>
  </main>

  <section class="story" aria-live="polite">
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="heading">
      <p class="eyebrow" data-field="eyebrow"></p>
      <h1 data-field="title"></h1>
    </div>
    <p class="text" data-field="text"></p>
    <div class="controls">
      <button type="button" id="prev" aria-label="Previous card"><svg viewBox="0 0 16 16"><path d="M10.5 2 4.5 8l6 6 1.2-1.2L6.9 8l4.8-4.8z"/></svg></button>
      <button type="button" id="pause" aria-label="Pause"><svg viewBox="0 0 16 16" id="pause-icon"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
      <button type="button" id="next" aria-label="Next card"><svg viewBox="0 0 16 16"><path d="M5.5 2 4.3 3.2 9.1 8l-4.8 4.8L5.5 14l6-6z"/></svg></button>
      <span class="count" id="count"></span>
    </div>
  </section>

  <!-- HTML panels. Their contents are sized in cqw, so they scale with the card. -->
  <template id="tpl-roll">
    <div class="roll-card">
      <p class="label">Roll for initiative</p>
      <svg class="d20" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="d20-gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbe6b4"/><stop offset=".55" stop-color="#e9bd6c"/><stop offset="1" stop-color="#c77f35"/>
          </linearGradient>
        </defs>
        <polygon points="32,4 56.2,18 56.2,46 32,60 7.8,46 7.8,18" fill="url(#d20-gold)" stroke="#0b0f1b" stroke-width="1.5" stroke-linejoin="round"/>
        <polygon points="32,11 49.5,41.5 14.5,41.5" fill="none" stroke="#8a5523" stroke-opacity=".5" stroke-width="1.2" stroke-linejoin="round"/>
        <text class="face" x="32" y="37.5" text-anchor="middle">20</text>
      </svg>
      <p class="result">Natural 20!</p>
    </div>
  </template>
  <template id="tpl-candlekeep">
    <div class="keep-card">
      <svg class="candle" viewBox="0 0 60 120" aria-hidden="true">
        <defs>
          <radialGradient id="flame" cx="50%" cy="70%" r="60%">
            <stop offset="0" stop-color="#fff6d8"/><stop offset=".45" stop-color="#ffcf6a"/><stop offset="1" stop-color="#e2733a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse class="flame" cx="30" cy="26" rx="10" ry="22" fill="url(#flame)"/>
        <path d="M30 44v8" stroke="#2a1906" stroke-width="2"/>
        <path d="M17 52h26v58H17z" fill="#efe1c0"/>
        <path d="M17 52h26v6c-6 4-8 0-13 3s-8-2-13 0z" fill="#fbf3df"/>
        <path d="M8 110h44v6H8z" fill="#8a5523"/>
      </svg>
      <div>
        <small>A campaign of my own · D&amp;D 2024</small>
        <b>Het mysterie van Candlekeep</b>
        <ul>
          <li><i>Lucius</i> the silver tongue</li>
          <li><i>Torrin</i> the laughing dwarf</li>
          <li><i>Gildance</i> the preacher</li>
          <li><i>Flint</i> who keeps to himself</li>
        </ul>
        <span>candlekeep.boomdock.nl</span>
      </div>
    </div>
  </template>
  <template id="tpl-map">
    <div class="map-card">
      <svg viewBox="0 0 640 360" aria-hidden="true">
        <g class="coast">
          <path d="M70 40c30 40 10 80 40 110s20 70 60 90 30 60 80 90"/>
          <path d="M470 60c-30 20-60 10-80 40s10 60-20 90 10 50 40 70"/>
        </g>
        <path class="route" d="M140 290C190 250 220 200 280 190S380 160 420 120"/>
        <g class="marks">
          <g class="mark" transform="translate(140 290)"><circle r="6"/><text x="12" y="20">Baldur’s Gate</text></g>
          <g class="mark" transform="translate(280 190)"><circle r="5"/><text x="-60" y="-14">the road</text></g>
          <g class="mark keep" transform="translate(420 120)"><path d="M-10 10V-8l5-6 5 6 5-6 5 6v18z"/><text x="16" y="4">Candlekeep</text></g>
          <g class="mark" transform="translate(540 300)"><text text-anchor="middle" class="dragons">Here be dragons</text></g>
        </g>
        <g class="rose" transform="translate(560 80)">
          <circle r="34"/><circle r="26" stroke-dasharray="2 6"/>
          <polygon points="0,-40 6,0 0,6 -6,0" class="lit"/><polygon points="0,40 6,0 0,-6 -6,0"/>
          <polygon points="-40,0 0,6 6,0 0,-6"/><polygon points="40,0 0,6 -6,0 0,-6"/>
        </g>
      </svg>
    </div>
  </template>
  <template id="tpl-desk">
    <div class="desk-card">
      <div class="medallion">
        <span class="halo"></span>
        <span class="orbit"></span>
        <img src="media/dungeon-desk-logo.png" alt="The Dungeon Desk logo" width="596" height="596">
      </div>
      <span class="word">Dungeon Desk</span>
      <span class="divider"><i></i><b></b><i></i></span>
      <p class="line">Gather round the table</p>
    </div>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
